name: Build PlugPro Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Setup OpenJDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Setup Android SDK (Explicitly specifying compileSdk 34 packages to avoid deprecated 'tools' error)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      # Step 4: Accept Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # Step 5: Locate project directory (handles root or subfolder checkouts)
      - name: Locate Android Root Directory
        id: find-root
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "./PlugPro-Services-main/gradlew" ]; then
            echo "dir=./PlugPro-Services-main" >> $GITHUB_OUTPUT
          else
            DIR=$(find . -maxdepth 3 -name "settings.gradle" -exec dirname {} \; | head -n 1)
            if [ -n "$DIR" ]; then
              echo "dir=$DIR" >> $GITHUB_OUTPUT
            else
              echo "dir=." >> $GITHUB_OUTPUT
            fi
          fi

      # Step 6: Grant execution permission for gradlew
      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: ${{ steps.find-root.outputs.dir }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      # Step 7: Verify gradle-wrapper.jar exists (prevents missing jar failure)
      - name: Verify Gradle Wrapper Jar
        working-directory: ${{ steps.find-root.outputs.dir }}
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found in git tracking. Downloading matching v8.2.2 wrapper jar..."
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.2/gradle/wrapper/gradle-wrapper.jar || true
          fi

      # Step 8: Ensure valid google-services.json exists
      - name: Check / Provide Fallback google-services.json
        working-directory: ${{ steps.find-root.outputs.dir }}
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Notice: app/google-services.json not found. Injecting fallback stub for compilation..."
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "plugpro-services-demo",
              "storage_bucket": "plugpro-services-demo.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.plugpro"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGithubActionsBuildPass"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # Step 9: Assemble Debug APK
      - name: Build Debug APK
        working-directory: ${{ steps.find-root.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 10: Locate generated APK
      - name: Locate Output APK
        id: locate-apk
        working-directory: ${{ steps.find-root.outputs.dir }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            echo "apk_path=${{ steps.find-root.outputs.dir }}/$APK_PATH" >> $GITHUB_OUTPUT
          else
            echo "Error: Output APK not found!"
            exit 1
          fi

      # Step 11: Upload APK as downloadable artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlugPro-Debug-APK
          path: ${{ steps.locate-apk.outputs.apk_path }}
          retention-days: 14
